
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Камеры</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="os-body">

<div class="os-layout">

  <aside class="sidebar">
    <div class="sidebar-logo">
      BCPD
      <span>CCTV Archive</span>
    </div>

    <nav class="sidebar-menu">
      <a href="desktop.html">Рабочий стол</a>
      <a href="../evidence.html">Улики</a>
      <a href="../suspects.html">Подозреваемые</a>
      <a href="access.html">Ввести код</a>
    </nav>
  </aside>

  <main class="workspace">

    <div class="topbar">
      <div>
        <h1>Архив камер</h1>
        <p>Записи наблюдения по делу BC-2025-017</p>
      </div>
      <div class="progress-box">CCTV</div>
    </div>

    <section class="camera-list">

      <div class="camera-card" data-level="4">

        <div class="camera-preview locked-preview">
          21:32
        </div>

        <div>
          <span class="tag gray">ЗАБЛОКИРОВАНО</span>

          <h2>Церковная дорога</h2>

          <p class="camera-description">
            Доступ к записи ограничен.
          </p>

          <button disabled
            data-file="../assets/documents/cctv/lina-is-leaving-with-thomas.mp4"
            data-title="Церковная дорога — 21:32"
            data-description="Лина садится в автомобиль Томаса Джонса.">
            Недоступно
          </button>
        </div>

      </div>

      <div class="camera-card" data-level="9">

        <div class="camera-preview locked-preview">
          20:00
        </div>

        <div>
          <span class="tag gray">ЗАБЛОКИРОВАНО</span>

          <h2>Сарай Уоллесов</h2>

          <p class="camera-description">
            Доступ к записи ограничен.
          </p>

          <button disabled
            data-file="../assets/documents/cctv/Ryan-steals-a-gun.mp4"
            data-title="Сарай Уоллесов — 20:00"
            data-description="Восстановленная запись с камеры наблюдения. Требуется изучение материала.">
            Недоступно
          </button>
        </div>

      </div>

    </section>

  </main>

</div>

<div id="documentModal"
     class="document-modal"
     style="display: none;">

  <div class="document-window">

    <div class="document-header">

      <strong id="documentTitle">
        Видеозапись
      </strong>

      <button class="close-doc"
        onclick="closeDocument()">
        Закрыть
      </button>

    </div>

    <div id="documentViewer"
         class="document-frame">
    </div>

  </div>

</div>

<script src="../js/game.js?v=6"></script>

<script>

  const progress = getProgress();

  if (progress < 4) {

    alert("Доступ к архиву камер ограничен.");
    location.replace("desktop.html");

  } else {

    document.querySelectorAll(".camera-card").forEach(card => {

      const requiredLevel = Number(card.dataset.level);

      const button = card.querySelector("button");
      const tag = card.querySelector(".tag");
      const preview = card.querySelector(".camera-preview");
      const description = card.querySelector(".camera-description");

      if (progress >= requiredLevel) {

        tag.textContent = "ДОСТУПНО";
        tag.className = "tag blue";

        preview.classList.remove("locked-preview");

        description.textContent = button.dataset.description;

        button.disabled = false;
        button.textContent = "Воспроизвести запись";

        button.onclick = function () {

          openDocument(
            button.dataset.file,
            button.dataset.title
          );

        };

      } else {

        tag.textContent = "ЗАБЛОКИРОВАНО";
        tag.className = "tag gray";

        button.disabled = true;
        button.textContent = "Недоступно";

      }

    });

  }

</script>

</body>
</html>
