<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Код доступа</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="terminal-body">

<main class="terminal-screen">

  <section class="login-panel">

    <div class="system-label">ACCESS TERMINAL</div>
    <div class="system-subtitle">BRIDGE CREEK POLICE DATABASE</div>

    <div class="terminal-line"></div>

    <p>Введите код доступа из конверта, чтобы открыть новые материалы расследования.</p>

    <br>

    <input id="accessCode" class="access-input" type="text" placeholder="ENTER ACCESS CODE">

    <button onclick="checkAccessCode()">Проверить код</button>
    <button onclick="location.href='desktop.html'">Вернуться на рабочий стол</button>

    <div id="accessResult"></div>

    <div class="terminal-footer">
      Все попытки доступа фиксируются в системе BCPD.
    </div>

  </section>

</main>

<script src="../js/game.js"></script>

</body>
</html>
