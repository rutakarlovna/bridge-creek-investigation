<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заключение детектива</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="os-body">

<body class="os-body">

<div class="workspace">

  <div class="topbar">
    <h1>Заключение детектива</h1>
    <p>Выберите человека, которого считаете убийцей Лины Харпер.</p>
  </div>

  <section class="system-alert">
    Внимание: после подтверждения заключения система проверит, достаточно ли доказательств.
    При ошибочном выборе доступ к засекреченным материалам будет закрыт.
  </section>

  <div class="decision-box">

    <label class="decision-option">
      <input type="radio" name="killer" value="mark">
      <span>Марк Уоллес</span>
    </label>

    <label class="decision-option">
      <input type="radio" name="killer" value="ryan">
      <span>Райан Уоллес</span>
    </label>

    <label class="decision-option">
      <input type="radio" name="killer" value="kyle">
      <span>Кайл Беннет</span>
    </label>

    <label class="decision-option">
      <input type="radio" name="killer" value="sarah">
      <span>Сара Коулман</span>
    </label>

    <label class="decision-option">
      <input type="radio" name="killer" value="thomas">
      <span>Томас Джонс</span>
    </label>

    <label class="decision-option">
      <input type="radio" name="killer" value="daniel">
      <span>Дэниел Рид</span>
    </label>

    <div class="decision-actions">
      <button onclick="location.href='desktop.html'">Вернуться к материалам</button>
      <textarea id="decisionReason" placeholder="Кратко опишите, почему вы считаете этого человека виновным..."></textarea>
      <button onclick="submitDecision()">Подтвердить заключение</button>
    </div>

  </div>

</div>

<script src="../js/game.js"></script>
</body>
</html>
